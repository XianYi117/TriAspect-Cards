<title>TriAspect Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：兩軍隔著中央「戰軸」對陣；右側情報欄放雙方數字與對戰紀錄 */
:root{
  --ink:#0d0f11; --slab:#15191c; --slab2:#1c2125; --rule:#2a3136; --rule2:#3a434a;
  --brass:#c9a35b; --brass-dim:#8a7243; --fg:#e7e1d3; --mute:#8d938f; --paper:#f3e8cf; --paper-ink:#2b2219;
  --R:#cf4a3a; --G:#3f9a55; --B:#3d7ccd; --X:#8a8780; --good:#79c27c; --bad:#e16a52;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 16px;
  background-image:radial-gradient(ellipse at 50% 46%,#1a1f23 0,transparent 60%),repeating-linear-gradient(45deg,transparent 0 22px,#ffffff05 22px 23px),repeating-linear-gradient(-45deg,transparent 0 22px,#ffffff05 22px 23px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-name{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.08em;color:var(--brass)}
.ver{font-size:12px;color:var(--mute);letter-spacing:.06em}
.turnline{flex:1;min-width:0;font-size:13px;color:var(--mute)}
.turnline b{color:var(--fg);font-family:var(--f-num);font-size:18px;margin-inline:2px}
.top-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--slab2);border:1px solid var(--rule2);border-radius:6px;padding:6px 14px;font-size:13px}
.btn:hover{border-color:var(--brass-dim)}
.btn.primary{background:var(--brass);color:#1b1408;border-color:var(--brass);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:12px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.board{display:flex;flex-direction:column;gap:10px;min-width:0}
.zlabel{font-size:11px;letter-spacing:.14em;color:var(--mute);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.zlabel b{color:var(--fg);font-weight:500;letter-spacing:0}
.zone{border:1px dashed var(--rule2);border-radius:8px;padding:8px 10px;min-width:0;background:#ffffff03}
.side{display:grid;grid-template-columns:172px minmax(0,1fr);gap:10px}
.fieldslot{display:flex;justify-content:center;align-items:center;min-height:204px}
.empty{color:var(--rule2);font-size:12px;letter-spacing:.1em}
.consume-list{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:56px}
.handrow{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;align-items:start}
.hand{display:flex;flex-wrap:wrap;gap:8px;min-height:190px;align-content:flex-start}
.opphand{display:flex;flex-wrap:wrap;gap:6px;min-height:76px}

/* 戰軸 */
.axis{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1.3fr);gap:16px;align-items:center;background:linear-gradient(90deg,var(--slab),var(--slab2) 50%,var(--slab));border-block:1px solid var(--brass-dim);padding:12px 14px;border-radius:4px}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.step{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--rule2);color:var(--mute)}
.step.on{border-color:var(--brass);color:#1b1408;background:var(--brass);font-weight:700}
.step.done{color:var(--fg);border-color:var(--rule2)}
.firstline{font-size:12px;color:var(--mute);margin-top:6px}
.firstline b{color:var(--brass)}
.duel{display:flex;align-items:center;gap:14px;font-family:var(--f-num)}
.pw{text-align:center;min-width:64px}
.pw .n{font-size:44px;line-height:1;font-weight:700}
.pw .who{font-family:var(--f-body);font-size:11px;color:var(--mute);letter-spacing:.1em}
.pw .mod{font-family:var(--f-body);font-size:11px;color:var(--brass)}
.vs{font-size:13px;color:var(--brass-dim);letter-spacing:.2em}
.pw.win .n{color:var(--good)} .pw.lose .n{color:var(--bad)}
.prompt{font-size:13.5px;min-width:0}
.prompt .tt{font-family:var(--f-display);font-size:17px;color:var(--brass);margin-bottom:2px}
.prompt .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.target-fx{background:var(--slab);border:1px solid var(--rule2);border-radius:6px;padding:6px 8px;margin-top:4px;font-size:12.5px}

/* 卡牌 */
.card{--w:128px;--cc:var(--X);width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)/16);background:var(--paper);border:calc(var(--w)/40) solid var(--cc);box-shadow:0 0 0 1px #00000088,0 6px 14px #00000066;display:flex;flex-direction:column;color:var(--paper-ink);position:relative;font-size:calc(var(--w)/12.5);overflow:hidden;flex:none;transition:transform .15s,box-shadow .15s}
.card.cR{--cc:var(--R)} .card.cG{--cc:var(--G)} .card.cB{--cc:var(--B)}
.card.l{--w:144px} .card.xl{--w:200px} .card.s{--w:96px} .card.xs{--w:54px}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-4px)}
.card.sel{box-shadow:0 0 0 3px var(--brass),0 8px 18px #000a;transform:translateY(-6px)}
.card.dim{opacity:.45}
.c-top{display:flex;align-items:center;gap:4px;background:#1a1d22;color:var(--paper);padding:3px 4px}
.c-cost{width:1.9em;height:1.9em;border-radius:50%;background:var(--cc);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:1.15em;flex:none}
.c-name{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-art{flex:1;min-height:0;position:relative;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%);display:grid;place-items:center}
.c-art span{font-family:var(--f-display);font-size:3.2em;color:color-mix(in srgb,var(--cc) 30%,transparent);font-weight:700}
.c-wild{position:absolute;top:4px;right:4px;font-size:.85em;background:var(--paper-ink);color:var(--paper);padding:0 .4em;border-radius:3px}
.c-fx{padding:3px 4px;display:flex;flex-direction:column;gap:2px;border-top:1px solid #0002}
.fxl{display:flex;gap:3px;line-height:1.25;font-size:.92em}
.tag{flex:none;font-size:.85em;padding:0 .35em;border-radius:3px;color:#fff;background:#222;height:1.45em;display:inline-grid;place-items:center}
.tag.magic{background:#6d3fb0} .tag.inter{background:#a24a23} .tag.instant{background:#1d7f7a}
.c-bot{display:flex;align-items:center;justify-content:space-between;background:#1a1d22;color:var(--paper);padding:2px 4px}
.c-atk{width:1.9em;height:1.9em;border-radius:50%;background:var(--cc);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:1.2em}
.c-atk.up{box-shadow:0 0 0 2px var(--good)} .c-atk.down{box-shadow:0 0 0 2px var(--bad)}
.c-id{font-family:var(--f-num);font-size:.95em;letter-spacing:.1em;color:var(--brass)}
.c-race{font-family:var(--f-display);font-weight:700;font-size:1.1em}
.card.back{background:#111 center/cover no-repeat;border-color:var(--brass-dim)}
.card.face-down-mine{outline:2px dashed var(--brass);outline-offset:3px}
.flag{position:absolute;left:50%;top:-1px;transform:translateX(-50%);background:var(--brass);color:#1b1408;font-size:11px;padding:0 8px;border-radius:0 0 6px 6px;white-space:nowrap;z-index:2}
.modbadge{position:absolute;right:-6px;top:38%;background:var(--slab);border:1px solid var(--brass);color:var(--brass);font-family:var(--f-num);font-weight:700;font-size:16px;padding:0 6px;border-radius:4px}

/* 消耗區：橫置的小卡 */
.tap{width:78px;height:54px;border-radius:5px;background:var(--paper);color:var(--paper-ink);border-left:8px solid var(--cc);display:flex;flex-direction:column;justify-content:center;padding:2px 6px;font-size:11px;line-height:1.25;box-shadow:0 2px 6px #0008;position:relative}
.tap.cR{--cc:var(--R)} .tap.cG{--cc:var(--G)} .tap.cB{--cc:var(--B)} .tap.cW{--cc:var(--brass)}
.tap b{font-family:var(--f-display);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tap.spent{opacity:.42}
.tap .undo{position:absolute;right:3px;bottom:3px;border:1px solid var(--paper-ink);background:var(--paper);color:var(--paper-ink);border-radius:3px;font-size:10px;line-height:1.3;padding:0 4px}
.tap .undo:hover{background:var(--paper-ink);color:var(--paper)}
.tap.spent::after{content:"已支付";position:absolute;right:4px;bottom:2px;font-size:9.5px}

/* 操作面板 */
.inspector{background:var(--slab);border:1px solid var(--rule2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.inspector h3{margin:0;font-family:var(--f-display);font-size:16px;color:var(--brass);font-weight:700}
.insp-top{display:flex;gap:10px;align-items:flex-start}
.insp-meta{font-size:12px;color:var(--mute);display:grid;gap:2px}
.insp-meta b{color:var(--fg);font-weight:500}
.act{display:flex;flex-direction:column;gap:3px;border:1px solid var(--rule2);border-radius:6px;padding:7px 8px;background:var(--slab2)}
.act .line{font-size:12.5px;display:flex;gap:6px;align-items:flex-start}
.act .go{display:flex;justify-content:space-between;align-items:center;gap:8px}
.act .state{font-size:11.5px;color:var(--mute)}
.act .state.ok{color:var(--good)}
.act .state.no{color:var(--bad)}
.act button{border-radius:5px;padding:4px 12px;font-size:12.5px;border:1px solid var(--brass);background:var(--brass);color:#1b1408;font-weight:700}
.act button:disabled{background:transparent;color:var(--mute);border-color:var(--rule2);font-weight:400;cursor:not-allowed}
.hint{font-size:12px;color:var(--mute)}
.pip{display:inline-flex;align-items:center;gap:1px;font-family:var(--f-num);font-weight:700}
.dot{width:.75em;height:.75em;border-radius:50%;display:inline-block;background:var(--X)}
.dot.R{background:var(--R)} .dot.G{background:var(--G)} .dot.B{background:var(--B)} .dot.W{background:var(--brass)}

/* 情報欄 */
.intel{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px)}
.info{background:var(--slab);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.info.me{border-color:var(--brass-dim)}
.info h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:16px}
.info h4 small{font-family:var(--f-body);font-size:11.5px;color:var(--mute);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.stat{background:var(--slab2);border-radius:5px;padding:4px 2px}
.stat .n{font-family:var(--f-num);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;color:var(--mute);letter-spacing:.06em}
.stat.life .n{color:var(--bad)}
.stat button{background:none;border:0;padding:0;width:100%}
.lifebar{display:flex;gap:3px;margin:6px 0 2px}
.lifebar i{flex:1;height:6px;border-radius:2px;background:var(--rule2)}
.lifebar i.on{background:var(--bad)}
.statusline{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:11px}
.chip{border:1px solid var(--rule2);border-radius:99px;padding:0 7px;color:var(--mute)}
.chip.used{color:var(--fg);border-color:var(--brass-dim)}
.chip.warn{color:var(--bad);border-color:var(--bad)}
.chip.good{color:var(--good);border-color:var(--good)}
.pool{display:flex;gap:8px;font-size:12px;margin-top:6px;align-items:center}
.logbox{background:var(--slab);border:1px solid var(--rule);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.loghead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
.loghead b{font-family:var(--f-display);font-size:15px}
.loghead .tools{display:flex;gap:6px;align-items:center}
.log{max-height:min(46vh,460px);overflow-y:auto;padding:6px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.log div{display:flex;gap:6px}
.log .t{font-family:var(--f-num);color:var(--mute);opacity:.7;flex:none;width:46px;line-height:1.15;font-size:11px;padding-top:2px}
.log .w0{color:#f0d9a6} .log .w1{color:#9fc0e8} .log .wsys{color:var(--mute)}
.log .wturn{color:var(--brass);font-weight:700;margin-top:4px}
label.tog{font-size:11.5px;color:var(--mute);display:flex;gap:4px;align-items:center;cursor:pointer}

/* 對話框 */
.veil{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--slab);border:1px solid var(--brass-dim);border-radius:10px;max-width:min(920px,100%);width:100%;max-height:100%;overflow:auto;padding:18px}
.dlg h2{margin:0 0 4px;font-family:var(--f-display);color:var(--brass);font-size:22px;text-wrap:balance}
.dlg p.d{margin:0 0 12px;color:var(--mute)}
.pickgrid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.pickitem{display:flex;flex-direction:column;gap:4px;align-items:center;max-width:220px}
.pickitem .lbl{font-size:12px;text-align:center}
.pickitem.on .card,.pickitem.on .lblcard{box-shadow:0 0 0 3px var(--brass);transform:translateY(-4px)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.dlg .row .sp{flex:1;color:var(--mute);font-size:12.5px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.opt{border:1px solid var(--rule2);background:var(--slab2);border-radius:8px;padding:8px 12px;text-align:left;min-width:120px}
.opt.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.opt small{display:block;color:var(--mute);font-size:11.5px}
.sec{font-size:12px;letter-spacing:.14em;color:var(--mute);margin:10px 0 4px}
.rps{display:flex;gap:10px;margin:10px 0}
.rps button{font-size:18px;padding:12px 20px;border-radius:8px;background:var(--slab2);border:1px solid var(--rule2);font-family:var(--f-display)}
.rps button:hover{border-color:var(--brass)}
.rpsres{font-family:var(--f-display);font-size:18px;color:var(--brass);min-height:28px}
.builder{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;margin-bottom:12px}
.brow{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--slab2);text-align:left;font-size:12px;line-height:1.35}
.brow.on{border-color:var(--brass);background:#2a2518}
.brow .bcost{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;color:#fff;flex:none}
.brow .bname{font-family:var(--f-display);font-size:14px}
.brow .bfx{color:var(--mute);font-size:11.5px}
.rules{columns:2 300px;column-gap:28px;font-size:13px}
.rules h3{font-family:var(--f-display);color:var(--brass);margin:10px 0 4px;font-size:15px;break-after:avoid}
.rules ul{margin:0;padding-left:18px}
.rules li{margin-bottom:3px}
.rules .note{color:var(--brass)}
.rules h4{font-family:var(--f-display);color:var(--fg);margin:10px 0 4px;font-size:14px;break-after:avoid}
.r-lead{font-size:15.5px;line-height:1.7;margin:4px 0 14px;max-width:62ch}
.r-lead b{color:var(--brass)}
.r-keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:6px}
.r-key{background:var(--slab2);border:1px solid var(--rule2);border-radius:8px;padding:10px 12px}
.r-k{font-family:var(--f-display);color:var(--brass);font-size:16px;margin-bottom:4px}
.r-key p{margin:0;font-size:13px;line-height:1.6}
.r-steps{margin:0;padding-left:0;list-style:none;counter-reset:st;display:grid;gap:6px;max-width:72ch}
.r-steps li{counter-increment:st;position:relative;padding-left:34px;min-height:24px;font-size:13.5px;line-height:1.7}
.r-steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--brass);color:#1b1408;font-family:var(--f-num);font-weight:700;display:grid;place-items:center;font-size:14px}
.r-fx{border-collapse:collapse;font-size:13px;width:100%;max-width:720px}
.r-fx th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;border-bottom:1px solid var(--rule2);padding:4px 8px}
.r-fx td{border-bottom:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.r-fx td:first-child{width:60px}
.r-note{font-size:13px;color:var(--mute);margin:8px 0 0;max-width:72ch;line-height:1.6}
.r-note b{color:var(--fg)}
.r-tips{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
.r-more{margin-top:16px;border-top:1px solid var(--rule2);padding-top:10px}
.r-more summary{cursor:pointer;font-family:var(--f-display);color:var(--brass);font-size:15px}
.r-more .rules{margin-top:8px}
.stage-pane h3,.dlg h3{font-family:var(--f-display);color:var(--brass);font-size:17px;margin:18px 0 8px}

.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100% - 32px)}
.toast{pointer-events:auto;cursor:pointer;background:var(--slab);border:1px solid var(--bad);border-radius:10px;padding:10px 14px 12px;box-shadow:0 10px 30px #000c;position:relative;overflow:hidden;animation:toastIn .25s ease-out}
.toast.mine{border-color:var(--bad);background:#24161399}
.toast-t{font-family:var(--f-display);color:var(--bad);font-size:15px;margin-bottom:8px;text-align:center}
.toast-cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--bad);animation:toastBar 5s linear forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes toastBar{from{width:100%}to{width:0}}
.brand-btn{background:none;border:0;padding:0;display:flex;align-items:baseline;gap:10px}
.top-act .btn.cur{border-color:var(--brass);color:var(--brass)}
/* 首頁：左側選單，右側大展示區（預設卡背，點選後顯示規則或圖鑑） */
.home{position:relative;min-height:calc(100dvh - 26px);overflow:hidden}
.home-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 72% 30%,color-mix(in srgb,var(--R) 18%,transparent),transparent 34%),radial-gradient(circle at 62% 72%,color-mix(in srgb,var(--B) 18%,transparent),transparent 34%),radial-gradient(circle at 86% 64%,color-mix(in srgb,var(--G) 16%,transparent),transparent 32%)}
.home-grid{position:relative;display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:clamp(20px,4vw,48px);min-height:calc(100dvh - 26px);padding-block:20px;align-items:stretch}
.home-menu{display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
.home-title{margin:0;line-height:.95;display:flex;flex-direction:column}
.ht1{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,6vw,70px);color:var(--brass);letter-spacing:.02em;text-shadow:0 2px 24px #c9a35b33}
.ht2{font-family:var(--f-num);font-weight:500;font-size:clamp(16px,2vw,20px);letter-spacing:.9em;color:var(--fg);margin-top:8px;padding-left:4px}
.home-sub{margin:0;color:var(--mute);display:flex;align-items:center;gap:6px;font-size:14px}
.home-sub .dot{margin-left:4px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mbtn{width:100%;text-align:left;background:var(--slab);border:1px solid var(--rule2);border-radius:10px;padding:12px 18px;display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s}
.mbtn b{font-family:var(--f-display);font-size:19px;font-weight:700}
.mbtn small{color:var(--mute);font-size:12px}
.mbtn:hover{border-color:var(--brass);transform:translateX(6px)}
.mbtn.on{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.mbtn.primary{background:var(--brass);border-color:var(--brass);color:#1b1408}
.mbtn.primary small{color:#3d2e12}
.home-ver{margin-top:12px;font-size:12px;color:var(--mute);letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.beta{font-family:var(--f-num);font-weight:700;letter-spacing:.15em;border:1px solid var(--brass-dim);color:var(--brass);border-radius:4px;padding:0 6px}
.home-stage{min-width:0;display:flex;flex-direction:column}
.stage-cover{flex:1;display:grid;place-items:center}
.stage-cover img{display:block;width:min(380px,70vw);max-width:100%;border-radius:16px;box-shadow:0 0 0 1px var(--brass-dim),0 30px 80px #000d;animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.stage-pane{flex:1;background:color-mix(in srgb,var(--slab) 92%,transparent);border:1px solid var(--rule2);border-radius:12px;padding:18px 20px;margin-top:36px;overflow:auto;max-height:calc(100dvh - 100px)}
.stage-pane h2{font-family:var(--f-display);color:var(--brass);font-size:24px;margin:0 0 4px}
.stage-pane p.d{color:var(--mute);margin:0 0 12px}
.dextabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dextab{border:1px solid var(--rule2);background:var(--slab2);border-radius:8px;padding:6px 16px;font-family:var(--f-display);font-size:16px;display:flex;align-items:center;gap:6px}
.dextab.on{border-color:var(--brass);color:var(--brass)}
.dexsec{font-size:12px;letter-spacing:.14em;color:var(--mute);margin:14px 0 8px}
.dexgrid{display:flex;flex-wrap:wrap;gap:14px}
.dexgrid .card{--w:150px}
.leaders{display:flex;flex-wrap:wrap;gap:10px}
.leader{background:var(--slab2);border:1px solid var(--rule2);border-radius:8px;padding:8px 12px;min-width:140px}
.leader b{font-family:var(--f-display);font-size:16px;display:block}
.leader small{color:var(--mute)}
@media (max-width:820px){.home-grid{grid-template-columns:1fr;min-height:0}.stage-pane{margin-top:0;max-height:none}}
@media (prefers-reduced-motion:reduce){.stage-cover img{animation:none}}
@media (max-width:1100px){.app{grid-template-columns:1fr}.intel{position:static}.handrow{grid-template-columns:1fr}}
@media (max-width:640px){
  .side{grid-template-columns:1fr}.axis{grid-template-columns:1fr}.card{--w:104px}.card.l{--w:132px}.card.xs{--w:46px}.fieldslot{min-height:0}
  .duel{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<section id="home" class="home" hidden>
  <div class="home-glow" aria-hidden="true"></div>
  <div class="home-grid">

</section>

<header class="top" id="topbar" hidden>

<main class="app" id="battleView" hidden>

  <aside class="intel">
    <div class="info" id="infoOpp"></div>
    <div class="info me" id="infoMe"></div>

        </div>
      </div>
      <div class="log" id="log"></div>
    </div>
  </aside>
</main>

<script>
// ===== 規則引擎 v1.0.2 =====
// 與畫面無關；透過 IO 物件和畫面（或測試程式）溝通。
const CN = { R: '紅', G: '綠', B: '藍', X: '灰' };
const TN = { magic: '魔法', inter: '干擾', instant: '立即' };
const IO = { ask: null, choose: null, render: () => {}, sleep: () => Promise.resolve(), onLog: () => {}, reveal: () => {} };

function parseOp(s) {
  let m;
  if ((m = s.match(/我方單位攻擊力\+(\d+)/))) return { op: 'buff', n: +m[1] };
  if ((m = s.match(/敵方單位攻擊力-(\d+)/))) return { op: 'debuff', n: +m[1] };
  if ((m = s.match(/敵方單位傷害-(\d+)/))) return { op: 'reduce', n: +m[1] };
  if (/抽2張牌，然後棄1張/.test(s)) return { op: 'drawDiscard' };
  if (/抽2張牌，然後放回1張/.test(s)) return { op: 'drawReturn' };
  if (/手牌中的2張牌放回牌庫/.test(s)) return { op: 'return2draw1' };
  if (/對手1張手牌回牌庫/.test(s)) return { op: 'oppMulligan' };
  if (/從棄牌堆隨機抽1張/.test(s)) return { op: 'salvage' };
  if ((m = s.match(/^抽(\d+)張牌/))) return { op: 'draw', n: +m[1] };
  if ((m = s.match(/回復(\d+)點血量/))) return { op: 'heal', n: +m[1] };
  if ((m = s.match(/直接造成(\d+)點傷害\(移至棄牌堆\)/))) return { op: 'burnDiscard', n: +m[1] };
  if ((m = s.match(/直接造成(\d+)點傷害/))) return { op: 'burn', n: +m[1] };
  if ((m = s.match(/對手隨機棄(\d+)張手牌/))) return { op: 'randDiscard', n: +m[1] };
  if (/對手選擇棄1張手牌/.test(s)) return { op: 'oppDiscard' };
  if (/手牌、牌庫頂各棄一張/.test(s)) return { op: 'discardHandTop' };
  if (/消耗費用\+1灰/.test(s)) return { op: 'tax', cost: { X: 1 } };
  if (/多花費1張藍色能量/.test(s)) return { op: 'tax', cost: { B: 1 } };
  if (/無法使用立即效果/.test(s)) return { op: 'noInstant' };
  if (/無效魔法效果/.test(s)) return { op: 'negate', magicOnly: true };
  if (/無效化?對手效果/.test(s)) return { op: 'negate' };
  if (/複製場上任意效果/.test(s)) return { op: 'copy' };
  if (/禁止使用魔法效果/.test(s)) return { op: 'seal' };
  if (/視為任意顏色/.test(s)) return { op: 'wild' };
  return { op: 'unknown', s };
}
function fullCost(c) { return { R: c.R || 0, G: c.G || 0, B: c.B || 0, X: c.X || 0 }; }
function parseFx(raw) {
  const m = raw.match(/^(魔法|干擾|立即)\/([^：:]+)[：:](.*)$/);
  if (!m) return { raw, type: 'magic', cost: fullCost({}), total: 0, body: raw, ops: [{ op: 'unknown' }], supported: false, interferable: true };
  const type = { 魔法: 'magic', 干擾: 'inter', 立即: 'instant' }[m[1]];
  const cost = fullCost({});
  m[2].split('+').forEach(s => { const k = s.match(/(紅|綠|藍|灰)(\d+)/); if (k) cost[{ 紅: 'R', 綠: 'G', 藍: 'B', 灰: 'X' }[k[1]]] += +k[2]; });
  const body = m[3].trim().replace(/[。．]+$/, '');
  let interferable = true;
  if (type === 'inter') interferable = false;
  // 立即效果：卡面寫「可被干擾」才能被干擾，沒寫視為不可被干擾（依設計說明第 5 點）
  if (type === 'instant') interferable = /\(可被干擾\)/.test(body);
  const clean = body.replace(/\(不?可被干擾\)/g, '').replace(/[。]/g, '');
  let ops = clean.split('、').map(s => parseOp(s.trim()));
  if (ops.some(o => o.op === 'unknown')) ops = [parseOp(clean)];
  return { raw, type, cost, total: cost.R + cost.G + cost.B + cost.X, body: clean, ops, supported: ops.every(o => o.op !== 'unknown'), interferable };
}
function costText(c) {
  const parts = ['R', 'G', 'B', 'X'].filter(k => c[k]).map(k => CN[k] + c[k]);
  return parts.length ? parts.join('+') : '免費';
}

let DEFS = {}, LEADERS = [];
function loadData(data) {
  DEFS = {};
  data.cards.forEach(c => { DEFS[c.id] = { ...c, fxP: c.fx.map(parseFx) }; });
  LEADERS = data.leaders;
}
let UID = 0;
function inst(def) { return { ...def, uid: ++UID, wild: false, usedFx: [] }; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let G = null;
function freshFlags() { return { magic: false, instant: false, noInstant: false, sealed: false, mod: 0, reduce: 0 }; }
function mkPlayer(name, leader, ids, ai) {
  const deck = shuffle(ids.map(id => inst(DEFS[id])));
  const p = { name, ai, leader, hpMax: leader.hp, deck, life: [], hand: [], discard: [], field: null, consume: [], flags: freshFlags(), hiddenPick: false };
  p.life = deck.splice(deck.length - leader.hp);
  p.hand = deck.splice(deck.length - 5);
  return p;
}
function newGame(cfg) {
  UID = 0;
  G = { pl: [mkPlayer(cfg.names[0], cfg.leaders[0], cfg.decks[0], cfg.ai[0]), mkPlayer(cfg.names[1], cfg.leaders[1], cfg.decks[1], cfg.ai[1])],
        turn: 1, first: cfg.first, phase: 'setup', step: null, over: null, log: [], result: null, startedAt: Date.now(), turnStarts: [] };
  log(`對局開始：${G.pl[0].name}（${cfg.leaders[0].name}）對 ${G.pl[1].name}（${cfg.leaders[1].name}）`, 'sys');
  log(`雙方各抽 ${cfg.leaders[0].hp} 張作為生命牌堆、5 張起始手牌。猜拳由 ${G.pl[cfg.first].name} 第 1 回合先攻。`, 'sys');
  return G;
}
function log(text, who = 'sys') { const e = { t: G ? G.turn : 0, ms: G && G.startedAt ? Date.now() - G.startedAt : 0, text, who }; G.log.push(e); IO.onLog(e); }
// 毫秒轉成「時:分:秒」，例如 00:45:10
function clock(ms) { const sec = Math.floor(ms / 1000), z = n => String(n).padStart(2, '0'); return `${z(Math.floor(sec / 3600))}:${z(Math.floor(sec / 60) % 60)}:${z(sec % 60)}`; }
function durText(ms) { const sec = Math.round(ms / 1000); return sec >= 60 ? `${Math.floor(sec / 60)} 分 ${sec % 60} 秒` : `${sec} 秒`; }
const opp = i => 1 - i;
const P = i => G.pl[i];

// ---- 牌堆操作 ----
function draw(i, n) {
  const p = P(i);
  for (let k = 0; k < n; k++) {
    if (p.deck.length) p.hand.push(p.deck.pop());
    else if (p.life.length) { p.hand.push(p.life.pop()); log(`${p.name} 的牌庫已空，改從生命牌堆抽 1 張（生命剩 ${p.life.length}）`, i); }
  }
}
function damage(i, n, toHand) {
  const p = P(i); const k = Math.min(n, p.life.length);
  const moved = [];
  for (let a = 0; a < k; a++) { const c = p.life.pop(); moved.push(c); (toHand ? p.hand : p.discard).push(c); }
  if (k) log(`${p.name} 失去 ${k} 張生命牌${toHand ? '，加入手牌' : `，移至棄牌堆：${moved.map(c => '【' + c.name + '】').join('')}`}（生命剩 ${p.life.length}）`, i);
  if (k && !toHand) IO.reveal({ who: i, title: `${p.name}的生命牌進入棄牌堆`, cards: moved });
}
function heal(i, n) {
  const p = P(i); const k = Math.min(n, p.hpMax - p.life.length, p.discard.length);
  for (let a = 0; a < k; a++) p.life.push(p.discard.pop());
  log(k ? `${p.name} 從棄牌堆頂回復 ${k} 張到生命牌堆（生命 ${p.life.length}）` : `${p.name} 的回復沒有效果（生命已滿或棄牌堆為空）`, i);
}
function removeFrom(arr, card) { const k = arr.indexOf(card); if (k >= 0) arr.splice(k, 1); return k >= 0; }
function undoEnergy(i, entry) {
  const p = P(i);
  if (entry.spent || !removeFrom(p.consume, entry)) return false;
  p.hand.push(entry.card);
  log(`${p.name} 將【${entry.card.name}】從消耗區返回手牌`, i);
  return true;
}
function toEnergy(i, card) {
  const p = P(i); removeFrom(p.hand, card);
  p.consume.push({ card, color: card.color, wild: card.wild, spent: false });
  log(`${p.name} 將【${card.name}】轉為${card.wild ? '任意色' : CN[card.color] + '色'}能量（橫置於消耗區）`, i);
}
function checkOver() {
  if (G.over) return true;
  const d = G.pl.map(p => p.life.length === 0);
  if (d[0] && d[1]) G.over = { draw: true };
  else if (d[0]) G.over = { winner: 1 };
  else if (d[1]) G.over = { winner: 0 };
  if (G.over) log(G.over.draw ? '雙方生命牌同時歸 0，平手！' : `${P(G.over.winner).name} 獲勝！${P(opp(G.over.winner)).name} 的生命牌歸 0。`, 'sys');
  return !!G.over;
}

// ---- 能量 ----
const unspent = p => p.consume.filter(e => !e.spent);
// 從可用來源中找出支付方式；來源依陣列順序優先使用
function planFrom(src, cost) {
  const avail = [...src], use = [];
  for (const col of ['R', 'G', 'B']) {
    for (let k = 0; k < cost[col]; k++) {
      let idx = avail.findIndex(a => !a.wild && a.color === col);
      if (idx < 0) idx = avail.findIndex(a => a.wild);
      if (idx < 0) return null;
      use.push(avail.splice(idx, 1)[0]);
    }
  }
  for (let k = 0; k < cost.X; k++) {
    let idx = avail.findIndex(a => !a.wild);
    if (idx < 0) idx = 0;
    if (!avail.length) return null;
    use.push(avail.splice(idx, 1)[0]);
  }
  return use;
}
function shortfall(p, cost) {
  const avail = unspent(p).slice(); const miss = { R: 0, G: 0, B: 0, X: 0 };
  for (const col of ['R', 'G', 'B']) for (let k = 0; k < cost[col]; k++) {
    let idx = avail.findIndex(a => !a.wild && a.color === col); if (idx < 0) idx = avail.findIndex(a => a.wild);
    if (idx < 0) miss[col]++; else avail.splice(idx, 1);
  }
  miss.X = Math.max(0, cost.X - avail.length);
  return ['R', 'G', 'B', 'X'].filter(k => miss[k]).map(k => (k === 'X' ? '任意' : CN[k] + '色') + '能量' + miss[k]).join('、');

  const src = [...unspent(p).map(e => ({ e, color: e.color, wild: e.wild })),

  const use = planFrom(src, cost);
  if (!use) return null;
  return { cards: use.filter(u => u.c).map(u => u.c) };
}
function aiSummon(i) {
  const p = P(i);
  const cands = p.hand.filter(c => canSummon(p, c));
  if (!cands.length) return { forced: true };
  cands.sort((a, b) => (b.atk * 1.2 - b.cost * 0.5) - (a.atk * 1.2 - a.cost * 0.5));
  const unit = cands[0];
  const opts = summonPayOptions(p, unit).sort((a, b) => val(a) - val(b));
  let pay = opts.slice(0, unit.cost);
  if (!pay.some(c => sameColor(c, unit))) pay = [opts.find(c => sameColor(c, unit)), ...opts.filter(c => !sameColor(c, unit)).slice(0, unit.cost - 1)];
  return { unit, pay };
}
function dmgWith(i, modMe, modOpp, redMe) {
  const me = P(i), o = P(opp(i));
  const pm = me.field ? Math.max(0, me.field.atk + me.flags.mod + modMe) : 0;
  const po = o.field ? Math.max(0, o.field.atk + o.flags.mod + modOpp) : 0;
  let dm = 0, dop = 0;
  if (pm === po) { dm = 1; dop = 1; } else if (pm < po) dm = po - pm; else dop = pm - po;
  return { me: Math.max(0, dm - me.flags.reduce - redMe), opp: Math.max(0, dop - o.flags.reduce) };
}
function aiOpValue(i, op) {
  const me = P(i), o = P(opp(i)), base = dmgWith(i, 0, 0, 0);
  switch (op.op) {
    case 'buff': { const a = dmgWith(i, modN(op), 0, 0); return (a.opp - base.opp) + (base.me - a.me) + 0.3 * modN(op); }
    case 'debuff': { const a = dmgWith(i, 0, -modN(op), 0); return (a.opp - base.opp) + (base.me - a.me) + 0.3 * modN(op); }
    case 'reduce': return Math.min(modN(op), base.me) + 0.15;
    case 'draw': return 0.8 * op.n;
    case 'drawDiscard': return 0.7;
    case 'drawReturn': return 0.5;
    case 'heal': return 1.1 * Math.min(op.n, me.hpMax - me.life.length, me.discard.length);
    case 'burn': return 1.2 * Math.min(op.n, o.life.length);
    case 'burnDiscard': return 1.6 * Math.min(op.n, o.life.length);
    case 'salvage': return me.discard.length ? 0.7 : 0;
    case 'randDiscard': return 0.8 * Math.min(op.n, o.hand.length);
    case 'oppMulligan': return 0.3;
    case 'seal': return o.field && o.field.fxP.some((f, k) => f.type === 'magic' && !o.field.usedFx.includes(k)) && !o.flags.magic ? 0.9 : 0.05;
    case 'wild': return 0.05;
    case 'copy': { const opts = copyOptions(); return opts.length ? Math.max(...opts.map(x => aiFxValue(i, x.fx))) : 0; }
    default: return 0;
  }
}
function aiFxValue(i, fx) { return fx.ops.reduce((s, op) => s + aiOpValue(i, op), 0); }
async function aiAction(i) {
  await IO.sleep(350);
  const p = P(i), win = { type: 'action', who: i };
  const w = p.hand.length >= 7 ? 0.3 : 0.6;
  let best = null;
  const consider = (where, card) => card.fxP.forEach((fx, idx) => {
    if (!fx.supported || fx.type === 'inter') return;
    if (where === 'field' && (card.usedFx.includes(idx) || (fx.type === 'magic' && p.flags.sealed))) return;
    if (fx.type === 'magic' && p.flags.magic) return;
    if (fx.type === 'instant' && (p.flags.instant || p.flags.noInstant)) return;
    if (fx.ops.some(o => o.op === 'copy') && !copyOptions().length) return;
    const plan = aiPlan(i, effCost(fx, where), where === 'hand' ? card : null);
    if (!plan) return;
    const net = aiFxValue(i, fx) - (plan.cards.length + (where === 'hand' ? 1 : 0)) * w;
    if (net > 0.2 && (!best || net > best.net)) best = { where, card, idx, plan, net };
  });
  p.hand.forEach(c => consider('hand', c));
  if (p.field) consider('field', p.field);
  if (!best) return null;
  best.plan.cards.forEach(c => toEnergy(i, c));
  if (whyNot(i, best.where, best.card, best.idx, win)) return null;
  return best;
}
async function aiResponse(o, E) {
  await IO.sleep(250);
  const p = P(o), harm = aiFxValue(E.owner, E.fx), t = P(E.owner);
  const w = p.hand.length >= 7 ? 0.3 : 0.6;
  let best = null;
  for (const c of responseCandidates(o, E)) {
    const plan = aiPlan(o, effCost(c.fx, c.where), c.where === 'hand' ? c.card : null);
    if (!plan) continue;
    let v = 0;
    for (const op of c.fx.ops) {
      if (op.op === 'negate') v += harm;
      else if (op.op === 'tax') v += planFrom(unspent(t), fullCost(op.cost)) ? 0.1 : (t.hand.length ? harm * 0.4 : harm);
      else if (op.op === 'oppDiscard') v += 0.6;
      else if (op.op === 'discardHandTop') v += 1.0;
      else if (op.op === 'return2draw1') v += 0.6;
      else if (op.op === 'noInstant') v += 0.2;
    }
    const net = v - (plan.cards.length + (c.where === 'hand' ? 1 : 0)) * w;
    if (net > 0.25 && (!best || net > best.net)) best = { ...c, plan, net };
  }
  if (!best) return null;
  best.plan.cards.forEach(c => toEnergy(o, c));
  if (whyNot(o, best.where, best.card, best.idx, { type: 'response', who: o, target: E })) return null;
  return best;
}

// ===== 牌組 =====
// 每套牌固定 3 張費用 3。
// 單色牌組：該色費用 1、2 全放（8+6），加 3 張該色費用 3，共 17 張；不足的 3 張從其他顏色的費用 1 隨機補。
// 隨機牌組：三色隨意，費用 1／2／3 = 9／8／3。
const MAX_COST3 = 3;
function buildDeck(colors) {
  const all = Object.values(DEFS);
  if (colors.length === 1) {
    const col = colors[0];
    const mine = all.filter(c => c.color === col);
    const out = [...mine.filter(c => c.cost < 3), ...shuffle(mine.filter(c => c.cost === 3)).slice(0, MAX_COST3)];
    const extra = shuffle(all.filter(c => c.color !== col && c.cost === 1));
    while (out.length < 20 && extra.length) out.push(extra.pop());
    return out.map(c => c.id);
  }
  const out = [];
  for (const [cost, n] of [[1, 9], [2, 8], [3, MAX_COST3]]) out.push(...shuffle(all.filter(c => colors.includes(c.color) && c.cost === cost)).slice(0, n));
  return out.map(c => c.id);
}
if (typeof module !== 'undefined') module.exports = { IO, RULES, loadData, effCost, whyNot, toEnergy, newGame, gameLoop, buildDeck, get G() { return G; }, get LEADERS() { return LEADERS; }, DEFS: () => DEFS, parseFx };

<script>

}

  if (kind === 'next') setTimeout(() => { if (pend && pend.kind === 'next' && pend.id === id && !modal) answer(true); }, 2200); });
IO.choose = opts => new Promise(res => { modal = { type: 'choose', ...opts, picked: opts.pre ? opts.pre.slice() : [], res }; render(); });

// ---- 小元件 ----
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function costHTML(c) {

const backHTML = (size, attrs = '') => `<div class="card back ${size || ''}" style="background-image:url(${BACK})" ${attrs}></div>`;
function tapHTML(e, undo) {

// ---- 主繪製 ----

  $('meHand').innerHTML = me.hand.map(c => cardHTML(c, { click: true, sel: sel && sel.uid === c.uid, dim: c.uid === pickedUid || payUids.includes(c.uid), attrs: `data-act="sel" data-where="hand" data-uid="${c.uid}" tabindex="0"` })).join('') || '<span class="empty">沒有手牌</span>';

function renderAxis() {

    return `<div class="tt">戰鬥結算</div><div>${txt}。你受到 ${r.d[0]} 點、對手受到 ${r.d[1]} 點傷害，扣除的生命牌加入手牌。</div><div class="acts"><button class="btn primary" data-act="next">回合結束</button><span class="hint" style="align-self:center">2 秒後自動進入下一回合</span></div>`;

function findCard(uid) {
  uid = +uid;
  const me = P(0), op = P(1);
  let c = me.hand.find(x => x.uid === uid); if (c) return { card: c, where: 'hand' };
  if (me.field && me.field.uid === uid) return { card: me.field, where: 'field' };

}
function renderInspector() {

  const f = sel && findCard(sel.uid);

      <div class="go"><span class="state ${ok ? 'ok' : 'no'}">${ok ? '可發動' : '無法發動：' + why}</span>${where === 'oppfield' ? '' : `<button data-act="fx" data-uid="${card.uid}" data-where="${where}" data-idx="${idx}" ${ok ? '' : 'disabled'}>發動</button>`}</div></div>`;
  });
  box.innerHTML = `<div class="insp-top">${cardHTML(card, { size: 's' })}<div class="insp-meta"><h3>${esc(card.name)}</h3><span>${whereTxt}</span><span>編號 <b>${card.id}</b>・${card.race}</span><span>召喚 <b>${CN[card.color]} ${card.cost}</b>・攻擊力 <b>${card.atk}</b></span>${where === 'hand' ? '<span>從手牌發動效果只能擇一，用完進棄牌堆</span>' : ''}${where === 'field' ? '<span>戰場角色的效果都可發動，能量從手牌支付</span>' : ''}</div></div>${acts}`;
}
function infoHTML(i) {

function startGame() {
  const s = modal;
  const myDeck = s.deck === 'custom' ? loadCustom() : buildDeck(PRESETS.find(p => p.key === s.deck).colors);
  lastSetup = { leader: s.leader, deck: s.deck, aiLeader: s.aiLeader, aiDeck: s.aiDeck };
  const aiLeader = s.aiLeader === 'rand' ? Math.floor(Math.random() * LEADERS.length) : s.aiLeader;
  let aiDeckName, aiDeckIds;
  if (s.aiDeck === 'custom' && loadCustom()) { aiDeckName = '我的牌組'; aiDeckIds = loadCustom(); }
  else { const pr = s.aiDeck === 'rand' || s.aiDeck === 'custom' ? PRESETS[Math.floor(Math.random() * PRESETS.length)] : PRESETS.find(p => p.key === s.aiDeck); aiDeckName = pr.name; aiDeckIds = buildDeck(pr.colors); }
  modal = null; sel = null; pend = null; lastLogLen = -1; gameId++;
  const myId = gameId;
  newGame({ names: ['你', '電腦'], leaders: [LEADERS[s.leader], LEADERS[aiLeader]], decks: [myDeck, aiDeckIds], ai: [false, true], first: s.first });
  log(`電腦使用「${aiDeckName}」（${s.aiDeck === 'rand' ? '完全隨機' : '指定'}）`, 'sys');
  render();
  gameLoop().catch(e => { if (myId === gameId) { log('程式錯誤：' + e.message, 'sys'); render(); console.error(e); } });
}

      <li>立即效果：卡面寫「可被干擾」的才能被干擾。</li>
    </ul>
  </div></details>`;

// ---- 事件 ----
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'toastclose') { toasts = toasts.filter(x => x.id !== +t.dataset.id); renderToasts(); return; }
  if (a === 'close') { if (t.classList.contains('veil') && ev.target !== t) return; modal = null; render(); return; }
  if (a === 'dbg') { showOppHand = t.checked; render(); return; }
  if (a === 'copylog') {
    const txt = G ? [`開局時間：${new Date(G.startedAt).toLocaleString('zh-TW', { hour12: false })}`, ...G.log.map(l => `[T${l.t} ${clock(l.ms)}] ${l.text}`)].join('\n') : '';
    try { await navigator.clipboard.writeText(txt); t.textContent = '已複製'; } catch (e) { const r = document.createRange(); r.selectNodeContents($('log')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = '已選取，請按複製'; }
    setTimeout(() => (t.textContent = '複製紀錄'), 1600); return;
  }
  if (a === 'home') { resetBattle(); go('home'); return; }
  if (a === 'battle') { go('battle'); return; }
  if (a === 'go-rules') { homeTab = homeTab === 'rules' ? 'cover' : 'rules'; renderHome(); return; }
  if (a === 'go-dex') { homeTab = homeTab === 'dex' ? 'cover' : 'dex'; renderHome(); return; }
  if (a === 'dexcol') { dexColor = t.dataset.k; renderHome(); return; }
  if (a === 'rules') { modal = { type: 'rules' }; render(); return; }
  if (a === 'home-play') { go('battle'); modal = newSetup(); render(); return; }
  if (a === 'setupcancel') { modal = null; if (!G) go('home'); else render(); return; }
  if (a === 'dexcard') { const c = DEFS[t.dataset.id]; modal = { type: 'view', title: `${c.id} ${c.name}`, cards: [{ ...c, usedFx: [] }], size: 'xl', note: `${CN[c.color]}色・費用 ${c.cost}・${c.race}・攻擊力 ${c.atk}` }; render(); return; }
  if (a === 'newgame') { go('battle'); modal = newSetup(); render(); return; }
  if (a === 'builder') { modal = { type: 'builder', picked: (loadCustom() || []).slice() }; render(); return; }
  if (a === 'setdeck') { modal.deck = t.dataset.k; render(); return; }
  if (a === 'setleader') { modal.leader = +t.dataset.k; render(); return; }
  if (a === 'setaileader') { modal.aiLeader = t.dataset.k === 'rand' ? 'rand' : +t.dataset.k; render(); return; }
  if (a === 'setaideck') { modal.aiDeck = t.dataset.k; render(); return; }
  if (a === 'rps') {
    const hands = ['剪刀', '石頭', '布'], me = +t.dataset.k, ai = Math.floor(Math.random() * 3);
    const res = (me - ai + 3) % 3; // 1 = 我贏
    if (res === 0) { modal.rps = `玩家出${hands[me]}，電腦也出${hands[ai]}：平手，請再猜一次。`; modal.first = undefined; }
    else { modal.first = res === 1 ? 0 : 1; modal.rps = `玩家出${hands[me]}，電腦出${hands[ai]}，${res === 1 ? '玩家' : '電腦'}獲勝：【${res === 1 ? '玩家先攻' : '玩家後攻'}】`; }
    render(); return;
  }
  if (a === 'start') { startGame(); return; }
  if (a === 'btoggle') { const id = t.dataset.id, p = modal.picked; const k = p.indexOf(id); if (k >= 0) p.splice(k, 1); else if (p.length < 20 && !(DEFS[id].cost === 3 && p.filter(x => DEFS[x].cost === 3).length >= MAX_COST3)) p.push(id); render(); return; }
  if (a === 'bclear') { modal.picked = []; render(); return; }
  if (a === 'bfill') { const rest = shuffle(Object.keys(DEFS).filter(id => !modal.picked.includes(id))); while (modal.picked.length < 20 && rest.length) { const id = rest.pop(); if (DEFS[id].cost === 3 && modal.picked.filter(x => DEFS[x].cost === 3).length >= MAX_COST3) continue; modal.picked.push(id); } render(); return; }
  if (a === 'bsave') { saveCustom(modal.picked); modal = { ...newSetup(), deck: 'custom' }; render(); return; }
  if (a === 'viewdiscard') { const p = P(+t.dataset.p); modal = { type: 'view', title: `${p.name}的棄牌堆（${p.discard.length} 張）`, cards: p.discard.slice() }; render(); return; }
  if (a === 'pick') {
    const k = +t.dataset.k, p = modal.picked, i = p.indexOf(k);
    if (i >= 0) p.splice(i, 1); else { if (modal.max === 1) p.length = 0; if (p.length < modal.max) p.push(k); }
    render(); return;
  }
  if (a === 'pickok') { const m = modal; modal = null; m.res(m.picked.map(k => m.items[k])); render(); return; }
  if (a === 'pickcancel') { const m = modal; modal = null; m.res(null); render(); return; }
  if (!G || G.over) return;
  if (a === 'sel') { sel = { uid: +t.dataset.uid }; render(); return; }
  if (!pend) return;
  if (a === 'end' && (pend.kind === 'action' || pend.kind === 'response')) { answer(null); return; }
  if (a === 'next' && pend.kind === 'next') { answer(true); return; }
  if (a === 'forced' && pend.kind === 'summon') { answer({ forced: true }); return; }
  if (a === 'unenergy' && (pend.kind === 'action' || pend.kind === 'response')) { const e = P(0).consume.find(x => x.card && x.card.uid === +t.dataset.uid); if (e && undoEnergy(0, e)) render(); return; }
  if (a === 'energy' && (pend.kind === 'action' || pend.kind === 'response')) { const f = findCard(t.dataset.uid); if (f && f.where === 'hand') { toEnergy(0, f.card); sel = null; render(); } return; }
  if (a === 'summon' && pend.kind === 'summon') {
    const f = findCard(t.dataset.uid); if (!f) return; const unit = f.card, me = P(0);
    const match = me.hand.filter(c => c !== unit && (c.color === unit.color || c.wild));
    const pre = match.map((c, k) => k).sort((x, y) => val(match[x]) - val(match[y])).slice(0, unit.cost);
    const r = await IO.choose({ title: `支付【${unit.name}】的召喚費用`, desc: `選 ${unit.cost} 張${CN[unit.color]}色手牌，翻開時進入棄牌堆。已先幫你選價值最低的牌，可以點選更換。`, items: match.map(c => ({ card: c })), min: unit.cost, max: unit.cost, pre, cancelText: '取消' });
    if (r && pend && pend.kind === 'summon') answer({ unit, pay: r.map(x => x.card) });
    return;
  }
  if (a === 'fx') {
    const f = findCard(t.dataset.uid); if (!f) return;
    const idx = +t.dataset.idx;
    if (whyNot(0, f.where, f.card, idx, G.step)) return;
    answer({ where: f.where, card: f.card, idx });
  }
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.card[data-act]')) { ev.preventDefault(); ev.target.click(); }
  if (ev.key === 'Escape' && modal && ['view', 'rules'].includes(modal.type)) { modal = null; render(); }
});

let lastSetup = null;
function newSetup() { const l = lastSetup || { leader: 0, deck: loadCustom() ? 'custom' : 'R', aiLeader: 'rand', aiDeck: 'rand' }; if (l.deck === 'custom' && !loadCustom()) l.deck = 'R'; return { type: 'setup', ...l }; }
// ---- 頁面切換：home 首頁（右側展示區：cover 卡背／rules 規則／dex 圖鑑）、battle 對戰 ----
const VERSION = '1.0.3';
let view = 'home', homeTab = 'cover', dexColor = 'R';
function go(v) {
  view = v;
  $('home').hidden = v !== 'home';
  $('topbar').hidden = v !== 'battle';
  $('battleView').hidden = v !== 'battle';
  if (v === 'home') renderHome();
  else if (G) render(); else renderEmptyBoard();
  window.scrollTo(0, 0);
}
function renderHome() {
  $('mRules').classList.toggle('on', homeTab === 'rules');
  $('mDex').classList.toggle('on', homeTab === 'dex');
  const st = $('homeStage');
  if (homeTab === 'rules') st.innerHTML = `<div class="stage-pane">${rulesHTML()}</div>`;
  else if (homeTab === 'dex') st.innerHTML = `<div class="stage-pane">${dexHTML()}</div>`;
  else st.innerHTML = `<div class="stage-cover"><img src="${BACK_LG}" alt="TriAspect Cards 卡背"></div>`;
}
function dexHTML() {
  const tabs = [['R', '紅'], ['B', '藍'], ['G', '綠']];
  const list = Object.values(DEFS).filter(c => c.color === dexColor).sort((x, y) => x.cost - y.cost || x.id.localeCompare(y.id));
  return `<h2>卡牌圖鑑</h2><p class="d">資料來自卡表 v1.0.2，點卡牌可放大。</p>
    <div class="dextabs">${tabs.map(([k, n]) => `<button class="dextab ${dexColor === k ? 'on' : ''}" data-act="dexcol" data-k="${k}"><i class="dot ${k}"></i>${n}色（${Object.values(DEFS).filter(c => c.color === k).length}）</button>`).join('')}</div>
    ${[1, 2, 3].map(cost => `<div class="dexsec">費用 ${cost}</div><div class="dexgrid">${list.filter(c => c.cost === cost).map(c => `<button data-act="dexcard" data-id="${c.id}" style="background:none;border:0;padding:0">${cardHTML({ ...c, usedFx: [] }, { click: true })}</button>`).join('')}</div>`).join('')}
    <div class="dexsec">主角</div><div class="leaders">${LEADERS.map(l => `<div class="leader"><b>${esc(l.name)}</b><small>${l.id}・${l.race}・生命 ${l.hp}・能力：暫無</small></div>`).join('')}</div>`;
}
go('home');
// 回首頁時放棄目前的對局，對戰畫面回到初始狀態
function resetBattle() {
  gameId++;            // 讓進行中的對局流程停止（等待中的步驟不會再繼續）
  G = null; pend = null; modal = null; sel = null; lastLogLen = -1;
  toasts = []; renderToasts();
  $('log').innerHTML = ''; $('infoOpp').innerHTML = ''; $('infoMe').innerHTML = '';
  ['oppConsume', 'meConsume', 'meHand', 'oppPool', 'mePool', 'oppHandN', 'meHandN'].forEach(id => ($(id).innerHTML = ''));
  renderEmptyBoard();
}
function renderEmptyBoard() {
  $('turnline').textContent = '選好主角與牌組後開始對戰';
  $('oppHand').innerHTML = Array.from({ length: 5 }, () => backHTML('xs')).join('');
  ['oppField', 'meField'].forEach(id => ($(id).innerHTML = backHTML('l')));
  $('axis').innerHTML = '<div class="steps"><span class="step">抽牌</span><span class="step">召喚</span><span class="step">翻開</span><span class="step">先攻行動</span><span class="step">後攻行動</span><span class="step">結算</span></div><div></div><div class="prompt"><div class="tt">準備開局</div></div>';
  $('inspector').innerHTML = '<h3>操作面板</h3><div class="hint">開始對戰後，點選卡牌會在這裡顯示可以進行的操作。</div>';
  renderModal();
}

</script>
